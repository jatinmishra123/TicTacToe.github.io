<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="msg-container hide">
      <div class="msg-card">
        <p id="msg">Winner</p>
        <button id="new-btn" class="btn btn-primary">New Game</button>
      </div>
    </div>
    <main>
      <h1>Tic Tac Toe</h1>

      <div class="options">
        <div class="toggle" id="mode-toggle">
          <button class="toggle-btn active" data-mode="pvp">2 Players</button>
          <button class="toggle-btn" data-mode="cpu">vs Computer</button>
        </div>
        <div class="toggle hide" id="level-toggle">
          <button class="toggle-btn" data-level="easy">Easy</button>
          <button class="toggle-btn active" data-level="hard">Hard</button>
        </div>
        <div class="toggle" id="size-toggle">
          <button class="toggle-btn active" data-size="3">3 x 3</button>
          <button class="toggle-btn" data-size="4">4 x 4</button>
          <button class="toggle-btn" data-size="5">5 x 5</button>
        </div>
        <div class="toggle" id="timer-toggle">
          <button class="toggle-btn active" data-seconds="0">No Timer</button>
          <button class="toggle-btn" data-seconds="10">10s</button>
          <button class="toggle-btn" data-seconds="5">5s</button>
        </div>
      </div>

      <div class="scoreboard">
        <div class="score score-o" id="card-o">
          <span class="score-name" id="name-o">Player O</span>
          <span class="score-value" id="score-o">0</span>
        </div>
        <div class="score score-draw">
          <span class="score-name">Draws</span>
          <span class="score-value" id="score-draw">0</span>
        </div>
        <div class="score score-x" id="card-x">
          <span class="score-name" id="name-x">Player X</span>
          <span class="score-value" id="score-x">0</span>
        </div>
      </div>

      <p id="status" aria-live="polite">Player O's turn</p>

      <p id="rule"></p>

      <div class="game"></div>

      <div class="actions">
        <button id="reset-btn" class="btn btn-primary">Restart Round</button>
        <button id="score-reset-btn" class="btn btn-ghost">Reset Scores</button>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
